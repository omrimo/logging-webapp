<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Log Viewer</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/app.js"></script>
</head>
<body>
<button id="openBtn" onclick="togglePopup()">Open Log Viewer</button>

<div class="window-frame hidden" id="logPopup">
    <div class="header-bar">
        <button class="close-btn" onclick="togglePopup()">&times;</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
            <tr>
                <th style="width: 30%;">Timestamp</th>
                <th style="width: 30%;">App</th>
                <th style="width: 40%;">Message</th>
            </tr>
            </thead>
            <tbody id="logTable"></tbody>
        </table>
    </div>

    <div class="controls">
        <button onclick="clearLogs()">Clear</button>
    </div>
</div>

</body>
</html>
